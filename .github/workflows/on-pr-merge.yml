name: Run Tests and Build App on Merge into Main

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  checkout:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04

    steps:
      - run: echo "Checking out ${{github.repository}} due to ${{github.event}}"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - run: echo "Checking out ${{github.repository}} due to ${{github.event}}"

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: echo "Complete with Status - ${{github.action_status}}"

